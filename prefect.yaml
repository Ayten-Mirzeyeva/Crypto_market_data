---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: Crypto Market
prefect-version: 3.8.1

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations. Left null: this project is deployed
# locally via `python deploy.py` (prefect .serve()), which already runs
# from the cloned repo's own working directory, so no machine-specific
# path is needed here. A hardcoded absolute path here would break on
# every machine except the one it was written on.
pull: null

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: crypto-daily
  version: null
  tags: []
  concurrency_limit: null
  description: null
  entrypoint: flow.py:crypto_pipeline
  parameters: {}
  work_pool:
    name: crypto-pool
    work_queue_name: null
    job_variables: {}
  schedules:
  - cron: 0 10 * * *
    timezone: Asia/Baku
    day_or: true
    active: true
